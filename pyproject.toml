[project]
name = "apprentice"
version = "0.1.0"
description = "A coding-agent gym where Beam's test-verified reasoning teaches a small model to fix real bugs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apprentice = "apprentice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apprentice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and local task data"]
addopts = "-m 'not docker'"
